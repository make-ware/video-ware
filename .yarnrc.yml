nodeLinker: node-modules

compressionLevel: mixed

enableGlobalCache: false

# Upstream omission: the plugin pulls in @typescript-eslint/* (which peer-depend
# on typescript) but never declares typescript as a peer dep of its own.
# Still missing as of 7.2.9 — remove once upstream declares it.
packageExtensions:
  '@darraghor/eslint-plugin-nestjs-typed@*':
    peerDependencies:
      typescript: '*'
